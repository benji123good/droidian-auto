<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vivace Input Diagnostic</title>
<style>
  html,body{height:100%;margin:0;background:#0b0d0f;color:#e6f7e6;font-family:monospace}
  #top{padding:10px;background:#111;display:flex;gap:12px;align-items:center}
  .btn{background:#222;color:#fff;padding:8px 12px;border-radius:6px;border:none}
  #status{padding:10px;font-size:14px;background:#0f1416;margin:10px;border-radius:6px}
  #log{white-space:pre-wrap;max-height:56vh;overflow:auto;padding:10px;background:#071011;border-radius:6px;margin:10px;font-size:12px}
  #hint{opacity:.8;margin:10px;font-size:13px}
  .green{color:#7fffd4}
  .red{color:#ff7b7b}
  #overlay{position:fixed;right:8px;bottom:8px;background:rgba(0,0,0,0.6);color:#9f9;padding:8px;border-radius:6px;pointer-events:none;z-index:9999}
</style>
</head>
<body>

<div id="top">
  <button id="btnClear" class="btn">Clear log</button>
  <button id="btnHome" class="btn">Show Home</button>
  <button id="btnNav" class="btn">Show Nav</button>
  <button id="btnHello" class="btn">Show Hello</button>
  <div id="status">Status: <span id="statText" class="green">waiting</span></div>
</div>

<div id="hint">Tap/click the buttons or anywhere on the screen. This page logs pointer, touch, mouse, and keyboard events. If nothing appears, BeamNG is not forwarding touch/pointer to the CEF page.</div>

<div id="content">
  <div id="home" class="page">Home — Welcome</div>
  <div id="nav" class="page" style="display:none">Navigation — Map placeholder</div>
  <div id="hello" class="page" style="display:none">Hello Car</div>
</div>

<div id="log">LOG:\n</div>
<div id="overlay">INPUT DIAG</div>

<script>
(function(){
  const logEl = document.getElementById('log');
  const stat = document.getElementById('statText');
  const pages = {home:document.getElementById('home'), nav:document.getElementById('nav'), hello:document.getElementById('hello')};
  let events = [];

  function push(msg){
    const t = new Date().toLocaleTimeString();
    events.unshift(t + ' — ' + msg);
    if(events.length>40) events.pop();
    logEl.textContent = 'LOG:\n' + events.join('\n');
  }

  function showPage(id){
    for(const k in pages) pages[k].style.display = 'none';
    if(pages[id]) pages[id].style.display = 'block';
    push('showPage: ' + id);
  }

  document.getElementById('btnClear').addEventListener('click', ()=>{ events=[]; logEl.textContent='LOG:\n'; push('cleared'); });
  document.getElementById('btnHome').addEventListener('click', ()=> showPage('home'));
  document.getElementById('btnNav').addEventListener('click', ()=> showPage('nav'));
  document.getElementById('btnHello').addEventListener('click', ()=> showPage('hello'));

  // Global listeners
  const types = ['pointerdown','pointerup','pointermove','touchstart','touchend','touchmove','mousedown','mouseup','mousemove','click','keydown','keyup'];
  types.forEach(t => {
    window.addEventListener(t, function(e){
      // Build coordinate info
      let x='n/a', y='n/a';
      if(e.touches && e.touches[0]) { x=e.touches[0].clientX; y=e.touches[0].clientY; }
      else { x = e.clientX !== undefined ? e.clientX : (e.pageX !== undefined ? e.pageX : 'n/a'); y = e.clientY !== undefined ? e.clientY : (e.pageY !== undefined ? e.pageY : 'n/a'); }
      const target = e.target && e.target.id ? e.target.id : (e.target && e.target.tagName ? e.target.tagName : 'unknown');
      push(`${t} target:${target} x:${x} y:${y} buttons:${e.buttons !== undefined ? e.buttons : 'n/a'}`);
      // Prevent default for touch/pointer to avoid gesture swallowing
      if((t==='touchstart' || t==='pointerdown') && e.cancelable) e.preventDefault();
    }, {passive:false, capture:true});
  });

  // Also attach to document.body to catch anything
  document.body.addEventListener('pointerdown', ()=> stat.textContent='pointer events received', {once:true});
  document.body.addEventListener('touchstart', ()=> stat.textContent='touch events received', {once:true});
  document.body.addEventListener('click', ()=> stat.textContent='mouse click received', {once:true});

  // initial
  push('diagnostic started');
  showPage('home');

  // small retry: if no events after 2s, log that
  setTimeout(()=> {
    if(events.length<=1) push('no input events detected yet — try tapping screen or clicking with mouse');
  }, 2000);

})();
</script>

</body>
</html>
